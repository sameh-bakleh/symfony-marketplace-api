framework:
    messenger:
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: messages
                    group: marketplace
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            sync: 'sync://'

        routing:
            App\Message\PersistNotificationMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
            routing:
                App\Message\PersistNotificationMessage: sync
