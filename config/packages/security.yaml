security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api_doc:
            pattern: ^/api/doc
            security: false
        api_login:
            pattern: ^/api/auth/login$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api_refresh:
            pattern: ^/api/auth/refresh$
            stateless: true
            provider: app_user_provider
            refresh_jwt:
                check_path: /api/auth/refresh
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/categories, roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
        - { path: ^/api/products, roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
        - { path: ^/api/platform/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/platform/contexts, roles: PUBLIC_ACCESS }
        - { path: ^/api/platform/categories, roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
        - { path: ^/api/platform/products, roles: PUBLIC_ACCESS, methods: [GET, HEAD] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
