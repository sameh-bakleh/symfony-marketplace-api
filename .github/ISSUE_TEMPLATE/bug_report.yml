name: Bug report
description: Report incorrect behavior or a regression
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce the issue locally.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: curl commands, routes, or test names
      placeholder: |
        1. docker compose up -d
        2. POST /api/auth/login ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PHP / Symfony version (if known)
      placeholder: e.g. PHP 8.3, Symfony 7.4

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Docker Compose
        - Local PHP (no Docker)
        - GitHub Actions CI
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or response body
      render: shell
